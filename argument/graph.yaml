# Argument graph of the study (research-methodology-core format). Encodes the logical structure of
# archive/docs/MATHEMATICAL_READING_GUIDE_Streamlined.md ("Summary: Logical Dependencies") and the strategies of
# archive/docs/RESEARCH_DOCUMENTATION_v2.md, Sec. 4. Status = the node's own step as the documents present it; the
# checker computes the standing of each chain. Notes record what the encoding made visible; they are questions for
# the author, not corrections.
version: 1
project: Lie-Poisson geometric criteria for classical optical emulation in MBQC

atoms:
  PAULI: "Pauli-basis measurements with Z2-linear feed-forward (Lemma A's conditions)"
  TW: "the graph has bounded treewidth (Lemma B's condition)"
  POLY: "dim(g_dyn) is in O(poly(n))"
  AB: "g_dyn is abelian on the relevant observables"
  SIM: "the MBQC protocol admits efficient classical simulation"
  HPS: "a nonlinear Boolean function is computed with high success probability p_s, Z2-linear feed-forward"
  CF: "the contextual fraction C_F(rho_G) is positive"

nodes:
  - id: Q1
    type: question
    title: When can MBQC be emulated by classical optics?
    statement: >
      For which MBQC protocols does an efficient classical (optical) emulation exist, and which quantum resources
      are necessary when it does not?
    success_criteria:
      - text: a criterion for classical simulability, proven in both directions
        met_by: [P0]
      - text: sufficient conditions that can be checked on a protocol
        met_by: [T1]
      - text: an obstruction - what a protocol needs to escape classical emulation
        met_by: [C2-1]
      - text: a classification of the MBQC primitives
        met_by: [T3]
    addressed_by: [P0, T1, C2-1, T3]
    status: open

  # ---------------------------------------------------------------- definitions and cited results
  - id: D1
    type: definition
    title: Poincare sphere and Stokes parameters
    statement: rho = (I + sum_i s_i sigma_i) / 2; pure states have |s| = 1, mixed states |s| < 1.
  - id: D2
    type: definition
    title: cluster state
    statement: "|Psi_G> = prod_{(i,j) in E} CZ_ij (x)_{v in V} |+>_v for a graph G = (V, E)."
  - id: D3
    type: definition
    title: MBQC protocol
    statement: >
      Pi = (G, rho_G, M, F, O): graph with gflow, cluster state, measurements M_v(theta_v), feed-forward,
      output function.
    depends_on: [D2]
  - id: D4
    type: definition
    title: dynamical Lie algebra g_MBQC
    statement: >
      g_MBQC = Lie closure of {i H_CZ, i sigma_k^(v)}; Pauli-only generators give dim 3n, with entangling gates
      dim 4^n - 1 (su(2^n)).
    depends_on: [D3]
  - id: A-dyn
    type: assumption
    kind: technical
    title: g_dyn depends on the protocol's measurement angles
    statement: >
      Proposition 0 and Lemma C use an algebra g_dyn that is not defined separately in the documents; it is taken
      to be a protocol-dependent algebra that can differ between protocols on the same graph.
    justification: >
      Needed for Proposition 0 to separate protocols at all: g_MBQC of D4 is generated by i H_CZ and all
      single-qubit Paulis and so does not depend on the measurement angles theta_v.
    sensitivity: >
      If g_dyn = g_MBQC, Proposition 0 classifies every protocol on a connected graph alike (dim 4^n - 1), Clifford
      protocols included - which Gottesman-Knill simulates efficiently.
  - id: KKS
    type: cited
    title: Kirillov-Kostant-Souriau theorem
    statement: >
      Every coadjoint orbit carries the canonical symplectic form omega_mu(xi, eta) = <mu, [xi, eta]>; the Poincare
      sphere S^2 = SU(2)/U(1) is a coadjoint orbit of SU(2).
    source:
      key: kirillov2004lectures
      locator: "coadjoint orbits and the KKS form (Kirillov 2004 [6]; Marsden and Ratiu 1999 [5])"
      status: textbook
      paraphrase: true
      conditions: []
  - id: D5
    type: definition
    title: quantum momentum map
    statement: "mu: S(H) -> g*, mu(rho)_alpha = Tr(rho S_alpha)."
    depends_on: [D4, KKS]
  - id: D6
    type: definition
    title: Lie-Poisson bracket
    statement: "{f, g}(mu) = <mu, [df(mu), dg(mu)]>; {f, g} = 0 iff [df, dg] = 0."
    depends_on: [D5, KKS]

  - id: GK
    type: cited
    title: Gottesman-Knill theorem (stabilizer tableaux)
    statement: >
      Stabilizer-state inputs, Clifford operations and Pauli measurements with classical feed-forward are
      simulated classically in polynomial time (O(n^2) per measurement with tableaux).
    source:
      key: aaronson2004improved
      locator: "Gottesman-Knill theorem; tableau algorithm (exact theorem / section not yet recorded)"
      status: published
      paraphrase: true
      conditions:
        - text: the input is a stabilizer state
          met_by: [D2]
        - text: Clifford operations and Pauli-basis measurements, classically controlled
          justification: Lemma A's hypotheses (Pauli-basis measurements, Z2-linear feed-forward)
  - id: MS
    type: cited
    title: tensor-network contraction (Markov and Shi)
    statement: A quantum circuit is simulated in time poly(n) exp(O(tw)) for the treewidth tw of its graph.
    source:
      key: markov2008simulating
      locator: "main theorem (exact number not yet recorded)"
      status: published
      paraphrase: true
      conditions:
        - text: polynomial time requires treewidth O(log n)
          justification: Lemma B's hypothesis (bounded treewidth)
  - id: GSIM
    type: cited
    title: g-sim (Goh et al.)
    statement: >
      Expectation values evolve within the dynamical Lie algebra, so they can be simulated in time poly(dim g).
    source:
      key: goh2025lie
      locator: "g-sim algorithm (Phys. Rev. Research 7, 033266 (2025), as cited in [7]; theorem not yet recorded)"
      status: published
      paraphrase: true
      conditions:
        - text: the measured observables lie in (the span of) the dynamical Lie algebra
        - text: >
            the evolution is unitary and generated by that algebra - MBQC adds mid-computation measurements and
            adaptive feed-forward, which the conditions have to be shown to cover

  # ---------------------------------------------------------------- central criterion
  - id: P0-bwd
    type: theorem
    title: Proposition 0, (<=) polynomial DLA gives simulation
    statement: >
      If dim(g_dyn) is in O(poly(n)) or g_dyn is abelian on the relevant observables, the protocol admits efficient
      classical simulation (Heisenberg evolution stays in a polynomial subspace; g-sim).
    formula: "POLY | AB -> SIM"
    status: sketched
    proof: archive/docs/MATHEMATICAL_READING_GUIDE_Streamlined.md
    depends_on: [D4, D6, A-dyn, GSIM]
  - id: P0-fwd
    type: theorem
    title: Proposition 0, (=>) simulation needs a polynomial DLA
    statement: >
      If the protocol admits efficient classical simulation, then dim(g_dyn) is in O(poly(n)) or g_dyn is abelian
      on the relevant observables ("polynomial tracking of <O>").
    formula: "SIM -> POLY | AB"
    status: sketched
    proof: archive/docs/MATHEMATICAL_READING_GUIDE_Streamlined.md
    depends_on: [D4, D5, A-dyn]
    notes: >
      The direction a counterexample would target: Clifford MBQC is simulable (Lemma A), while by D4 its generators
      (i H_CZ and the Paulis) generate su(2^n). The direction holds only for a g_dyn that is small for Clifford
      protocols - see A-dyn.
  - id: P0
    type: theorem
    title: Proposition 0 - the integrability criterion
    statement: >
      An MBQC protocol admits efficient classical simulation if and only if dim(g_dyn) is in O(poly(n)) or g_dyn is
      abelian on the relevant observables.
    formula: "SIM <-> POLY | AB"
    form: equivalence
    status: proven
    directions: {forward: P0-fwd, backward: P0-bwd}
    role: main

  # ---------------------------------------------------------------- sufficient conditions
  - id: LA
    type: lemma
    title: Lemma A - Gottesman-Knill
    statement: Pauli-basis measurements with Z2-linear feed-forward give an O(n^2) classical simulation.
    formula: "PAULI -> SIM"
    status: proven
    proof: archive/docs/MATHEMATICAL_READING_GUIDE_Streamlined.md
    depends_on: [D3, GK]
    notes: >
      The documents add "Clifford operations generate dim(g) = O(n^2)"; the lemma does not need it, and it
      conflicts with D4 (with CZ the algebra is su(2^n)) unless g_dyn is meant (A-dyn).
  - id: LB
    type: lemma
    title: Lemma B - bounded treewidth
    statement: A graph of treewidth w gives tensor-network contraction in O(2^w poly(n)).
    formula: "TW -> SIM"
    status: proven
    proof: archive/docs/MATHEMATICAL_READING_GUIDE_Streamlined.md
    depends_on: [D3, MS]
    notes: The remark that bounded treewidth factorises the DLA is not needed for the lemma and is not proven.
  - id: LC
    type: lemma
    title: Lemma C - g-sim
    statement: dim(g_dyn) = d in O(poly(n)) gives classical simulation in O(d^3) by propagation on g*.
    formula: "POLY -> SIM"
    status: proven
    proof: archive/docs/MATHEMATICAL_READING_GUIDE_Streamlined.md
    depends_on: [D4, A-dyn, GSIM]
  - id: T1
    type: theorem
    title: Theorem 1 - unified sufficient conditions
    statement: Each of the conditions of Lemmas A, B and C implies efficient classical simulation.
    formula: "(PAULI | TW | POLY) -> SIM"
    status: proven
    derivation: logical
    depends_on: [LA, LB, LC]
    role: main
    validated_by: [E-bench]
    notes: >
      The documents phrase it as "A, B or C implies Proposition 0's criterion" (a polynomial or abelian DLA). Lemmas
      A and B conclude simulability, not a polynomial DLA, so that reading also needs P0-fwd; the version encoded
      here concludes simulability and needs no part of Proposition 0.
  - id: A-opt
    type: assumption
    kind: modelling
    title: classical simulability stands for classical-optics emulation
    statement: >
      A protocol that admits efficient classical simulation is taken to admit a classical-optics emulation with
      polynomial resources (e.g. Mueller-matrix propagation of Stokes vectors).
    justification: S2 realises single-qubit dynamics with Mueller matrices on Stokes vectors (D1).
    sensitivity: >
      Classical optics encodes multi-qubit states in single-beam degrees of freedom whose number grows
      exponentially (S1, S3 do not scale); without this assumption the results concern classical simulability,
      not optical emulation.
  - id: M-emul
    type: method
    title: classical optical emulation of a simulable protocol
    statement: Emulate a protocol that satisfies a condition of Theorem 1 with classical optics.
    status: proposed
    depends_on: [T1, A-opt]

  # ---------------------------------------------------------------- obstruction
  - id: ABM
    type: cited
    title: contextual fraction bounds the success of l2-MBQC
    statement: >
      For l2-MBQC (Z2-linear classical processing) computing a Boolean function f, the failure probability is at
      least (1 - C_F) times the normalised distance of f from the affine functions.
    source:
      key: abramsky2017contextual
      locator: "the l2-MBQC success-probability bound (Phys. Rev. Lett. 119, 050504 (2017))"
      status: published
      paraphrase: true
      conditions:
        - text: Z2-linear classical side-processing (l2-MBQC)
          justification: the hypothesis of Theorem 2
    notes: The documents cite Raussendorf (2013) [4]; the quantitative bound with C_F is the one stated here.
  - id: D7
    type: definition
    title: contextual fraction
    statement: C_F(rho) in [0, 1], the minimal weight of contextual correlations; C_F = 0 iff noncontextual model.
    depends_on: [ABM]
  - id: T2
    type: theorem
    title: Theorem 2 - contextuality barrier
    statement: >
      For a nonlinear Boolean function f with Z2-linear feed-forward, p_s <= 1 - (1 - C_F(rho_G)) d_H(f, Aff_n)/2^n;
      so high success requires C_F > 0.
    formula: "HPS -> CF"
    status: proven
    proof: archive/docs/MATHEMATICAL_READING_GUIDE_Streamlined.md
    depends_on: [D7, ABM]
    role: main
  - id: C2-1
    type: corollary
    title: Corollary 2.1 - high success needs an exponential DLA
    statement: >
      High success on nonlinear functions requires C_F(rho_G) > 0, "which by contrapositive of Proposition 0
      implies dim(g_dyn) not in O(poly(n))".
    formula: "HPS -> !POLY"
    status: proven
    derivation: logical
    depends_on: [T2, P0]
    notes: >
      As a step from T2 and P0 alone this does not follow: it also needs "C_F > 0 implies no efficient classical
      simulation", which neither states. That premise is in tension with Anders and Browne (Phys. Rev. Lett. 102,
      050502 (2009)): GHZ states with Pauli measurements and linear side-processing compute OR deterministically -
      contextual, yet a stabilizer computation that Gottesman-Knill simulates.

  # ---------------------------------------------------------------- classification
  - id: D8
    type: definition
    title: classically exchangeable primitive
    statement: Primitive P_i is classically exchangeable if dim(g_i) is in O(poly(n)).
    depends_on: [D4]
  - id: T3
    type: theorem
    title: Theorem 3 - classification of the primitives
    statement: >
      Qubits (P1) and the graph (P3) are classically exchangeable in both the Clifford and the universal case; the
      cluster state (P2), the measurements (P4) and the algorithm (P5) only in the Clifford case.
    status: sketched
    proof: archive/docs/MATHEMATICAL_READING_GUIDE_Streamlined.md
    depends_on: [D8, T1, C2-1]
    role: main
    validated_by: [E-prod]
  - id: C3-1
    type: corollary
    title: Corollary 3.1
    statement: >
      Computing classically hard nonlinear functions with p_s -> 1 requires some primitive P_i with dim(g_i) in
      Omega(4^n).
    status: sketched
    proof: archive/docs/MATHEMATICAL_READING_GUIDE_Streamlined.md
    depends_on: [T3, C2-1]

  # ---------------------------------------------------------------- strategies (RESEARCH_DOCUMENTATION_v2, Sec. 4)
  - id: S1
    type: method
    title: S1 path (x) polarisation
    statement: Two qubits in the path and polarisation of a single beam; dim(g) = 4, does not scale to n qubits.
    status: proposed
    depends_on: [D1]
  - id: S2
    type: method
    title: S2 Mueller matrices
    statement: Stokes vectors propagated by 4x4 real Mueller matrices; dim(g) = 3n, no inter-photon correlations.
    status: proposed
    depends_on: [D1, KKS]
  - id: S3
    type: method
    title: S3 orbital angular momentum
    statement: Higher-dimensional single-beam encoding in OAM modes; dim(g) = (2L+1)^2.
    status: proposed
    depends_on: [D1]
  - id: S4
    type: method
    title: S4 hybrid degrees of freedom
    statement: All classical degrees of freedom combined; polynomial DLA, product-state correlations only.
    status: proposed
    depends_on: [S1, S2, S3]
  - id: S5
    type: method
    title: S5 KLM
    statement: Ancillas and postselection give probabilistic entangling gates; exponential DLA (quantum regime).
    status: proposed
    depends_on: [D4]

  # ---------------------------------------------------------------- numerical corroboration
  - id: E-prod
    type: claim
    title: product states reach fidelity 1/2 with cluster states
    statement: The maximal fidelity of an n-qubit product state with the n-qubit cluster state is 1/2.
    status: proposed
    evidence: {level: numerical, scope: "the n computed in archive/numerical_validation"}
  - id: E-bench
    type: claim
    title: benchmarks of the simulable cases
    statement: The Python benchmarks in archive/numerical_validation agree with the simulable cases of Theorem 1.
    status: proposed
    evidence: {level: numerical, scope: "the instances in archive/numerical_validation (small n)"}
